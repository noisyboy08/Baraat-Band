<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dhol drum body -->
  <ellipse cx="32" cy="32" rx="20" ry="16" fill="#A8232D" stroke="#E8A93B" stroke-width="2.5"/>
  <!-- Drum face left -->
  <ellipse cx="14" cy="32" rx="6" ry="16" fill="#F5C242" opacity="0.9"/>
  <!-- Drum face right -->
  <ellipse cx="50" cy="32" rx="6" ry="16" fill="#F5C242" opacity="0.9"/>
  <!-- Rope/string details -->
  <line x1="14" y1="18" x2="50" y2="22" stroke="#E8A93B" stroke-width="1.5" opacity="0.7"/>
  <line x1="14" y1="46" x2="50" y2="42" stroke="#E8A93B" stroke-width="1.5" opacity="0.7"/>
  <line x1="14" y1="26" x2="50" y2="30" stroke="#E8A93B" stroke-width="1" opacity="0.5"/>
  <line x1="14" y1="38" x2="50" y2="34" stroke="#E8A93B" stroke-width="1" opacity="0.5"/>
  <!-- Drumstick -->
  <line x1="40" y1="10" x2="30" y2="28" stroke="#F5C242" stroke-width="3" stroke-linecap="round"/>
  <circle cx="40" cy="10" r="3" fill="#E8A93B"/>
</svg>